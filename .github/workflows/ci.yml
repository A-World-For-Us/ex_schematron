name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      # Keyed by sha with a prefix fallback: each run saves a fresh incremental
      # _build, so the compiled schematron validators are reused across runs.
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      - run: mix test
